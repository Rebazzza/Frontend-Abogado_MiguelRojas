<router-outlet></router-outlet>

<mat-form-field appearance="outline" style="margin: 20px 0 10px 20px; width: calc(100% - 40px); max-width: 400px;">
  <mat-label>Filtrar Audiencias</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Civil" #input>
</mat-form-field>

<div class="mat-elevation-z8" style="margin: 0 20px 20px 20px;">
  <table mat-table [dataSource]="$dataSource()" matSort>

    <ng-container matColumnDef="idAudiencia">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{ row.idAudiencia }} </td>
    </ng-container>

    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
      <td mat-cell *matCellDef="let row"> {{ row.fecha }} </td>
    </ng-container>

    <ng-container matColumnDef="hora">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Hora </th>
      <td mat-cell *matCellDef="let row"> {{ row.hora ?? '—' }} </td>
    </ng-container>

    <ng-container matColumnDef="tipoAudiencia">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
      <td mat-cell *matCellDef="let row"> {{ row.tipoAudiencia ?? '—' }} </td>
    </ng-container>

    <ng-container matColumnDef="direccion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Dirección </th>
      <td mat-cell *matCellDef="let row"> {{ row.direccion }} </td>
    </ng-container>

    <ng-container matColumnDef="lugarLink">
      <th mat-header-cell *matHeaderCellDef> Enlace </th>
      <td mat-cell *matCellDef="let row">
        @if (row.lugarLink) {
          <a [href]="row.lugarLink" target="_blank" mat-icon-button color="primary" title="Abrir enlace">
            <mat-icon>open_in_new</mat-icon>
          </a>
        } @else {
          <span style="color: #aaa;">—</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="openDialog(row)" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(row.idAudiencia)" title="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="7" style="text-align: center; padding: 15px;">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccionar página de audiencias"></mat-paginator>
</div>

<button mat-fab color="primary" style="position: fixed; bottom: 20px; right: 20px;" (click)="openDialog()" title="Registrar nueva audiencia">
  <mat-icon>add</mat-icon>
</button>
