<div class="example-container">
  <mat-toolbar class="example-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()">
      @if (!sidenav.opened) {
        <mat-icon>menu</mat-icon>
      } @else {
        <mat-icon>close</mat-icon>
      }
    </button>

    <span>MIGUEL ROJAS</span>

    <span class="example-spacer"></span>

    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <button mat-menu-item>
        <mat-icon>account_box</mat-icon>
        <span>My account</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="example-sidenav-container">
    <mat-sidenav #sidenav style="width: 250px" mode="side" opened>

      <img src="logo_provi.png" width="128" style="margin-left: 20px; margin-top: 10px; margin-bottom: 10px;">
      <mat-divider></mat-divider>

      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input
          class="search-input"
          type="text"
          placeholder="Buscar en el menú..."
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
        />
        @if (searchQuery()) {
          <button class="search-clear" mat-icon-button (click)="searchQuery.set('')">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>
      <mat-divider></mat-divider>

      @for (item of filteredItems(); track item.route) {
        <button
          class="myButton"
          [routerLinkActive]="['active']"
          mat-menu-item
          (click)="sidenav.toggle()"
          [routerLink]="item.route"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </button>
        <mat-divider></mat-divider>
      }

      @if (!hasFilteredResults()) {
        <div class="no-results">
          <span>Sin resultados</span>
        </div>
      }
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
