<div class="example-container">
  <mat-sidenav-container class="example-sidenav-container">
    
    <mat-sidenav #sidenav class="juridibase-sidenav" mode="side" opened>
      
      <div class="sidebar-header">
        <span class="logo-text">JURIDIBASE</span>
      </div>

      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input
          class="search-input"
          type="text"
          placeholder="Buscar en el men..."
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
        />
        @if (searchQuery()) {
          <button class="search-clear" mat-icon-button (click)="searchQuery.set('')">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <div class="menu-items-container">
        @for (item of filteredItems(); track item.route) {
          <button
            class="menu-item-btn"
            [routerLinkActive]="['active']"
            [routerLink]="item.route"
          >
            <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
            <span class="menu-label">{{ item.label }}</span>
          </button>
        }

        @if (!hasFilteredResults()) {
          <div class="no-results">
            <span>Sin resultados</span>
          </div>
        }
      </div>

      <div class="sidebar-footer">
        <button class="logout-btn" (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      
      <div class="top-user-bar">
        <app-notification-bell></app-notification-bell>
        <div class="user-profile">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ username() || 'Usuario' }}</span>
        </div>
      </div>

      <div class="view-wrapper">
        <router-outlet></router-outlet>
      </div>
      
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
