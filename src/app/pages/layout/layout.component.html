<div class="example-container">
    <mat-toolbar class="example-toolbar">
        <button mat-icon-button (click)="sidenav.toggle()">
            @if (!sidenav.opened) {
                <mat-icon>menu</mat-icon>
            }@else {
                <mat-icon>close</mat-icon>
            }
        </button>

        <span>MIGUEL ROJAS</span>

        <span class="example-spacer"></span>

        <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
            <button mat-menu-item>
                <mat-icon>account_box</mat-icon>
                <span>My account</span>
            </button>
            <button mat-menu-item (click)="sidenav.opened = false" >
                <mat-icon>exit_to_app</mat-icon>
                <span>Logout</span>
            </button>
        </mat-menu>
    </mat-toolbar>
    
    <mat-sidenav-container class="example-sidenav-container">
        <mat-sidenav #sidenav style="width: 250px" mode="side" opened>

            <img src="logo_provi.png" width="128" style="margin-left: 20px">

           <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']"  mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/expediente" >
                <mat-icon>search</mat-icon>
                <span>Search</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']"  mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/cliente" >
                <mat-icon>accessibility</mat-icon>
                <span>Clientes</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/abogado" >
                <mat-icon>star_rate</mat-icon>
                <span>Abogados</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()" 
                routerLink="/pages/usuario" >
                <mat-icon>assignment</mat-icon>
                <span>Usuario</span>
            </button>
            
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/audiencia" >
                <mat-icon>healing</mat-icon>
                <span>Audiencias</span>
            </button>
            <mat-divider></mat-divider>            
            
            <button class="myButton" [routerLinkActive]="['active']"  mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/especialista">
                <mat-icon>view_carousel</mat-icon>
                <span>Especialista</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']"  mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/pago" >
                <mat-icon>assessment</mat-icon>
                <span>Pagos</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/area_derecho">
                <mat-icon>balance</mat-icon>
                <span>Áreas de Derecho</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/cita">
                <mat-icon>event_available</mat-icon>
                <span>Citas</span>
            </button>
            <mat-divider></mat-divider>
        </mat-sidenav> 

        <mat-sidenav-content>
            <router-outlet></router-outlet>            
        </mat-sidenav-content>

    </mat-sidenav-container>
</div>
