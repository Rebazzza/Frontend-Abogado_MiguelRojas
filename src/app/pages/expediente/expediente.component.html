<div class="container">
  <h1>EXPEDIENTES</h1>
  
  <!-- Buscador -->
  <mat-form-field class="search-field">
    <mat-label>Buscar expediente</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Caso penal">
  </mat-form-field>

  <!-- Lista de Expedientes -->
  <div class="list-container">
    <button 
      mat-button 
      class="list-item" 
      *ngFor="let expediente of getFilteredExpedientes()"
      (click)="verDetalles(expediente.idExPediente)">
      <div class="item-content">
        <h3>{{ expediente.victima }} - {{ expediente.titulo }}</h3>
        <p class="subtitle">{{ expediente.resumenExpediente }}</p>
      </div>
      <div class="item-date">
        {{ expediente.fechaInicio | date: 'dd/MM/yyyy' }}
      </div>
    </button>

    <!-- Mensaje cuando no hay datos -->
    <div *ngIf="getFilteredExpedientes().length === 0" class="no-data">
      <p>No hay expedientes para mostrar</p>
    </div>
  </div>
</div>
