<h2 mat-dialog-title style="margin-bottom: 10px;">
  <mat-icon style="vertical-align: middle; margin-right: 8px;">
    {{ edicion ? 'edit' : 'handyman' }}
  </mat-icon>
  {{ edicion ? 'Modificar Servicio Legal' : 'Registrar Nuevo Servicio Legal' }}
</h2>

<mat-dialog-content style="min-width: 500px; display: flex; flex-direction: column; gap: 12px; padding-top: 10px;">
  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 10px;">

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. Consultoría Legal">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" placeholder="Descripción del servicio" rows="3"></textarea>
      <mat-error *ngIf="form.get('descripcion')?.hasError('required')">La descripción es obligatoria</mat-error>
    </mat-form-field>

    <div style="display: flex; gap: 10px;">
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Costo Base</mat-label>
        <input matInput formControlName="costoBase" type="number" step="0.01" placeholder="0.00">
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="estado">
          <mat-option value="ACTIVO">Activo</mat-option>
          <mat-option value="INACTIVO">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" style="padding-bottom: 15px;">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="operate()">
    {{ edicion ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
