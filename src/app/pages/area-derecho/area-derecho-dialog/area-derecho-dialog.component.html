<h2 mat-dialog-title style="margin-bottom: 10px;">
  <mat-icon style="vertical-align: middle; margin-right: 8px;">
    {{ edicion ? 'edit' : 'gavel' }}
  </mat-icon>
  {{ edicion ? 'Modificar Área de Derecho' : 'Registrar Área de Derecho' }}
</h2>

<mat-dialog-content style="min-width: 400px; display: flex; flex-direction: column; gap: 12px; padding-top: 10px;">
  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 10px;">

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. Derecho Penal">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
      <mat-error *ngIf="form.get('nombre')?.hasError('maxlength')">Máximo 100 caracteres</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" rows="3" placeholder="Breve descripción del área..."></textarea>
      <mat-error *ngIf="form.get('descripcion')?.hasError('required')">La descripción es obligatoria</mat-error>
      <mat-error *ngIf="form.get('descripcion')?.hasError('maxlength')">Máximo 200 caracteres</mat-error>
    </mat-form-field>

    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0;">
      <mat-slide-toggle formControlName="estado" color="primary">
        {{ form.get('estado')?.value ? 'Activo' : 'Inactivo' }}
      </mat-slide-toggle>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" style="padding-bottom: 15px;">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="operate()">
    {{ edicion ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
